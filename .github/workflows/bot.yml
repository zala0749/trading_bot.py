name: trading-bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests pandas numpy

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python trading_bot.py --balance 1000 --risk 1

      - name: Save last signal
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot_state.json || true
          git commit -m "update state" || echo "no change"
          git push || echo "nothing to push"
